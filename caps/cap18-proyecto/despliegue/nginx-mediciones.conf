# Proxy inverso opcional con nginx, delante de 127.0.0.1:8080.
# Se instala, por ejemplo, en /etc/nginx/conf.d/mediciones.conf.
server {
    listen 80;
    server_name mediciones.example.com;
    # Mismo límite que LIMITE_CUERPO en src/peticion.rs.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        # Antes de nginx 1.29.7 el valor por defecto era 1.0,
        # y el servicio solo acepta HTTP/1.1.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
